name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json (for example, 1.1.0)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Test and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate requested version
        id: meta
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version must look like 1.1.0 or 1.1.0-beta.1."
          }

          $packageVersion = node -p "require('./package.json').version"
          if ($version -ne $packageVersion) {
            throw "Requested version $version does not match package.json version $packageVersion."
          }

          $tag = "v$version"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($existingTag) {
            throw "Tag $tag already exists. Increase the package version before releasing."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset=flect-v$version-windows.zip" >> $env:GITHUB_OUTPUT

      - name: Run checks and tests
        run: |
          npm run check
          npm test

      - name: Smoke-test bundled Windows runtime
        shell: pwsh
        run: |
          .\scrcpy-win64\scrcpy.exe --version
          .\scrcpy-win64\adb.exe version

      - name: Build release archive and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          git archive --format=zip --prefix=flect-windows/ --output="dist/${{ steps.meta.outputs.asset }}" $env:GITHUB_SHA
          $hash = (Get-FileHash "dist/${{ steps.meta.outputs.asset }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ steps.meta.outputs.asset }}" | Set-Content "dist/${{ steps.meta.outputs.asset }}.sha256"

      - name: Build release notes from changelog
        shell: pwsh
        run: |
          node scripts/release-notes.js '${{ steps.meta.outputs.version }}' --output release-notes.md

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $arguments = @(
            'release', 'create', '${{ steps.meta.outputs.tag }}',
            "dist/${{ steps.meta.outputs.asset }}#Flect Windows ZIP",
            "dist/${{ steps.meta.outputs.asset }}.sha256#SHA-256 checksum",
            '--target', $env:GITHUB_SHA,
            '--title', 'Flect ${{ steps.meta.outputs.tag }}',
            '--notes-file', 'release-notes.md',
            '--generate-notes',
            '--fail-on-no-commits'
          )

          if ($env:IS_PRERELEASE -eq 'true') {
            $arguments += @('--prerelease', '--latest=false')
          } else {
            $arguments += '--latest'
          }

          & gh @arguments
