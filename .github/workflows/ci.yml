name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and sanity checks
        run: npm run check

      - name: Pairing tests
        run: npm test

      - name: Smoke-test bundled Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scrcpy-win64\scrcpy.exe --version
          .\scrcpy-win64\adb.exe version
